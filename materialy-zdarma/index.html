<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Bezplatný statický zápis o aritmetických a geometrických posloupnostech ve formátu PDF.">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0; url=/Posloupnost_%C3%BAvod.pdf">
  <title>Posloupnosti – statický zápis v PDF</title>
  <style>
    :root{--navy:#102a43;--blue:#2563eb;--muted:#64748b;--page:#f8fafc;--border:#e2e8f0}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--page);color:var(--navy);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:min(520px,100%);padding:36px;border:1px solid var(--border);border-radius:18px;background:#fff;box-shadow:0 18px 45px rgba(15,23,42,.1)}
    h1{margin:0 0 12px;font-size:clamp(28px,6vw,42px);letter-spacing:-.04em;line-height:1.1}
    p{margin:0 0 22px;color:var(--muted)}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;text-decoration:none}
    a:hover{background:var(--blue)}
  </style>
  <script>
    window.location.replace('/Posloupnost_%C3%BAvod.pdf');
  </script>
</head>
<body>
  <main>
    <h1>Posloupnosti</h1>
    <p>Otevírám bezplatný statický zápis ve formátu PDF.</p>
    <a href="/Posloupnost_%C3%BAvod.pdf">Otevřít statický zápis v PDF</a>
  </main>
</body>
</html>
