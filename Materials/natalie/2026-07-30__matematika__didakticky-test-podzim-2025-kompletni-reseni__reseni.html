<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Načítání řešení didaktického testu…</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:15vh auto;padding:24px;color:#17365d} .box{border:1px solid #cbd5e1;border-radius:12px;padding:24px;background:#f8fafc} .error{color:#a61b1b}</style></head><body><div class="box"><h1>Načítám kompletní řešení…</h1><p id="status">Didaktický test z matematiky, podzim 2025.</p></div><script>
(async()=>{const names=['part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt'];try{const responses=await Promise.all(names.map(n=>fetch('./didaktak-podzim-2025/'+n)));for(const r of responses){if(!r.ok)throw new Error('Nepodařilo se načíst část materiálu ('+r.status+').');}const html=(await Promise.all(responses.map(r=>r.text()))).join('');document.open();document.write(html);document.close();}catch(e){const s=document.getElementById('status');s.className='error';s.textContent='Materiál se nepodařilo načíst: '+e.message;}})();
</script></body></html>
