<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaktivní funkce — Vojta</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#5f6b7a;--accent:#24527a;--line:#d8e0ea;--good:#2f7d57;--bad:#a84444}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.controls{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center}.row input[type=range]{width:100%}.row input[type=number],select{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}
    canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.formula{font-size:1.35rem;font-weight:700;color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:#f7f9fc;border:1px solid var(--line);padding:12px;border-radius:12px}.stat b{display:block;font-size:1.1rem}.muted{color:var(--muted);font-size:.92rem}.quiz{display:grid;gap:12px}.quiz label{font-weight:600}.quiz input{padding:10px;border:1px solid var(--line);border-radius:10px;width:100%}.quiz button{padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.feedback{min-height:24px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <h1>Interaktivní procvičování funkcí</h1>
    <p>Lineární a kvadratická funkce: parametry, graf, průsečíky, vrchol a kontrolní otázky.</p>
  </section>

  <section class="grid">
    <div class="card controls">
      <label>Typ funkce
        <select id="type">
          <option value="linear">Lineární funkce</option>
          <option value="quadratic">Kvadratická funkce</option>
        </select>
      </label>
      <div id="linearControls">
        <div class="row"><label for="m">Směrnice m</label><input id="mN" type="number" step="0.5" value="2"></div>
        <input id="m" type="range" min="-5" max="5" step="0.5" value="2">
        <div class="row"><label for="b">Posun b</label><input id="bN" type="number" step="0.5" value="-2"></div>
        <input id="b" type="range" min="-8" max="8" step="0.5" value="-2">
      </div>
      <div id="quadControls" hidden>
        <div class="row"><label for="a">Koeficient a</label><input id="aN" type="number" step="0.5" value="1"></div>
        <input id="a" type="range" min="-4" max="4" step="0.5" value="1">
        <div class="row"><label for="qB">Koeficient b</label><input id="qBN" type="number" step="0.5" value="-2"></div>
        <input id="qB" type="range" min="-8" max="8" step="0.5" value="-2">
        <div class="row"><label for="c">Koeficient c</label><input id="cN" type="number" step="0.5" value="-3"></div>
        <input id="c" type="range" min="-10" max="10" step="0.5" value="-3">
      </div>
      <div class="formula" id="formula"></div>
      <p class="muted" id="explain"></p>
    </div>

    <div class="card">
      <canvas id="graph" width="720" height="500" aria-label="Graf funkce"></canvas>
      <div class="stats">
        <div class="stat"><span class="muted">Průsečík s osou y</span><b id="yint"></b></div>
        <div class="stat"><span class="muted">Průsečík(y) s osou x</span><b id="xint"></b></div>
        <div class="stat"><span class="muted">Další údaj</span><b id="extra"></b></div>
      </div>
    </div>
  </section>

  <section class="card quiz">
    <h2>Rychlá kontrola</h2>
    <label id="question"></label>
    <input id="answer" type="text" placeholder="Zapiš odpověď">
    <button id="check" type="button">Zkontrolovat</button>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const pairs=[['m','mN'],['b','bN'],['a','aN'],['qB','qBN'],['c','cN']];
for(const [r,n] of pairs){$(r).addEventListener('input',()=>{$(n).value=$(r).value;draw()});$(n).addEventListener('input',()=>{$(r).value=$(n).value;draw()})}
$('type').addEventListener('change',()=>{$('linearControls').hidden=$('type').value!=='linear';$('quadControls').hidden=$('type').value!=='quadratic';draw()});
const cv=$('graph'),ctx=cv.getContext('2d'); const sx=40, sy=40, ox=cv.width/2, oy=cv.height/2;
function fmt(v){if(!Number.isFinite(v))return '—'; return Math.abs(v)<1e-10?'0':Number(v.toFixed(2)).toString()}
function axes(){ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#d8e0ea';ctx.lineWidth=1;for(let x=ox%sx;x<cv.width;x+=sx){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}for(let y=oy%sy;y<cv.height;y+=sy){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}ctx.strokeStyle='#172033';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(cv.width,oy);ctx.stroke();ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,cv.height);ctx.stroke()}
function plot(fn){ctx.strokeStyle='#24527a';ctx.lineWidth=3;ctx.beginPath();let first=true;for(let px=0;px<=cv.width;px++){const x=(px-ox)/sx,y=fn(x),py=oy-y*sy;if(py<-5000||py>5000){first=true;continue}if(first){ctx.moveTo(px,py);first=false}else ctx.lineTo(px,py)}ctx.stroke()}
let correct='';
function draw(){axes();if($('type').value==='linear'){const m=+$('m').value,b=+$('b').value;plot(x=>m*x+b);$('formula').textContent=`y = ${fmt(m)}x ${b>=0?'+':'−'} ${fmt(Math.abs(b))}`;$('yint').textContent=`[0; ${fmt(b)}]`;$('xint').textContent=m===0?(b===0?'nekonečně mnoho':'žádný'):`[${fmt(-b/m)}; 0]`;$('extra').textContent=m>0?'rostoucí':m<0?'klesající':'konstantní';$('explain').textContent='Směrnice m určuje sklon přímky, parametr b její průsečík s osou y.';$('question').textContent='Jaký je průsečík grafu s osou y? Zapiš pouze y-ovou souřadnici.';correct=fmt(b)}else{let a=+$('a').value,b=+$('qB').value,c=+$('c').value;if(a===0){a=.5;$('a').value=.5;$('aN').value=.5}plot(x=>a*x*x+b*x+c);$('formula').textContent=`y = ${fmt(a)}x² ${b>=0?'+':'−'} ${fmt(Math.abs(b))}x ${c>=0?'+':'−'} ${fmt(Math.abs(c))}`;$('yint').textContent=`[0; ${fmt(c)}]`;const D=b*b-4*a*c;let roots='žádný';if(D===0)roots=`[${fmt(-b/(2*a))}; 0]`;if(D>0)roots=`[${fmt((-b-Math.sqrt(D))/(2*a))}; 0], [${fmt((-b+Math.sqrt(D))/(2*a))}; 0]`;$('xint').textContent=roots;const xv=-b/(2*a),yv=a*xv*xv+b*xv+c;$('extra').textContent=`V = [${fmt(xv)}; ${fmt(yv)}]`;$('explain').textContent='Koeficient a určuje otevření paraboly, b posouvá osu souměrnosti a c je průsečík s osou y.';$('question').textContent='Jaká je x-ová souřadnice vrcholu paraboly?';correct=fmt(xv)}}
$('check').addEventListener('click',()=>{const val=$('answer').value.trim().replace(',','.');const ok=Math.abs(parseFloat(val)-parseFloat(correct))<0.01;$('feedback').textContent=ok?'Správně.':'Zkus znovu. Správná hodnota vychází z aktuálně nastavených parametrů.';$('feedback').className='feedback '+(ok?'good':'bad')});
draw();
</script>
</body>
</html>
