<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Self-check – zrychlení, 1. ročník SŠ</title><style>:root{--ink:#102a43;--muted:#627d98;--blue:#2563eb;--orange:#ea580c;--line:#d9e2ec}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:28px auto 70px}.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,32px);margin:16px 0}.hero{background:linear-gradient(135deg,#eff6ff,#fff7ed)}h1{font-size:clamp(28px,5vw,46px);margin:.15em 0}.tag{font-weight:800;color:#c2410c}.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ea580c,#2563eb);width:0}.formula{font:700 22px Georgia,serif;background:#f8fafc;padding:16px;border-radius:12px;margin:14px 0}.answers{display:grid;gap:10px}.answers button{padding:13px;text-align:left;background:#fff;border:1px solid #b8c6d9;border-radius:12px;font:inherit;cursor:pointer}.answers button.sel{border-color:var(--blue);background:#eff6ff}.answers button.good{border-color:#10b981;background:#ecfdf5}.answers button.bad{border-color:#ef4444;background:#fef2f2}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.actions button,.link{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.feedback{padding:14px;border-radius:12px;margin-top:14px}.ok{background:#ecfdf5;color:#047857}.no{background:#fef2f2;color:#b91c1c}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:#f8fafc;border-radius:14px;padding:16px;text-align:center}.stat b{font-size:30px;display:block}</style></head><body><main class="wrap"><section class="box hero"><span class="tag">36 úloh · 72 bodů · náhodné varianty</span><h1>Zrychlení — self-check</h1><p>Tři obtížnosti, převody jednotek, grafy, rozjezdy, brzdění a volný pád.</p><a class="link" href="index.html">← Interaktivní zápis</a></section><section class="box" id="quiz"><div class="progress"><i id="bar"></i></div><p id="meta" class="muted"></p><h2 id="topic"></h2><div id="formula" class="formula"></div><p id="prompt"></p><div id="answers" class="answers"></div><div id="feedback"></div><div class="actions"><button id="hint">Nápověda</button><button id="check" disabled>Zkontrolovat</button><button id="next" hidden>Další</button></div></section><section class="box" id="result" hidden><h2>Výsledek</h2><div class="stats"><div class="stat"><b id="score"></b>bodů z 72</div><div class="stat"><b id="pct"></b>úspěšnost</div><div class="stat"><b id="rating"></b>hodnocení</div></div><p id="advice"></p><div class="actions"><button id="again">Nové varianty</button><button id="csv">Export CSV</button></div></section></main><script>const $=s=>document.querySelector(s),Q=(t,f,p,o,a,e,h,l)=>({t,f,p,o,a,e,h,l}),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>(+n.toFixed(2)).toString();function make(){let q=[],push=(...x)=>q.push(Q(...x));
push('Význam zrychlení','a = 3 m/s²','Co tato hodnota znamená?',['Rychlost je vždy 3 m/s','Rychlost se mění o 3 m/s každou sekundu','Dráha roste o 3 m','Čas je 3 s'],1,'Zrychlení je změna rychlosti za jednotku času.','Čti jednotku m/s² jako „metr za sekundu každou sekundu“.','Základní');push('Jednotka','a = Δv/Δt','Jaká je jednotka SI?',['m','m/s','m/s²','km/h'],2,'(m/s)/s = m/s².','Poděl jednotku rychlosti jednotkou času.','Základní');let km=R(8,30)*3.6;push('Převod rychlosti',`${fmt(km)} km/h`,'Převeď na m/s.',[fmt(km/3.6),fmt(km*3.6),fmt(km/36),fmt(km)],0,'Kilometry za hodinu dělíme 3,6.','km/h ÷ 3,6.','Základní');let ms=R(4,25);push('Převod rychlosti',`${ms} m/s`,'Převeď na km/h.',[fmt(ms/3.6),fmt(ms*3.6),fmt(ms*36),fmt(ms)],1,'Metry za sekundu násobíme 3,6.','m/s × 3,6.','Základní');let v0=R(0,12),a=R(1,5),t=R(2,7),v=v0+a*t;push('Rychlost',`v₀=${v0} m/s, a=${a} m/s², t=${t} s`,'Urči konečnou rychlost.',[`${v} m/s`,`${v0+a} m/s`,`${a*t} m/s`,`${v0*t+a} m/s`],0,'Použij v=v₀+at.','Vynásob a·t a přičti v₀.','Základní');v0=R(8,22);a=-R(1,5);t=R(1,3);v=v0+a*t;push('Zpomalení',`v₀=${v0} m/s, a=${a} m/s², t=${t} s`,'Urči rychlost.',[`${v} m/s`,`${v0-a*t} m/s`,`${Math.abs(a)*t} m/s`,`${v0} m/s`],0,'Záporné zrychlení rychlost v kladném směru snižuje.','Ve v=v₀+at ponech záporné znaménko a.','Základní');a=R(1,5);t=R(2,6);push('Dráha z klidu',`v₀=0, a=${a} m/s², t=${t} s`,'Urči dráhu.',[`${.5*a*t*t} m`,`${a*t} m`,`${a*t*t} m`,`${.5*a*t} m`],0,'s=½at².','Nezapomeň čas umocnit na druhou.','Základní');v0=R(2,8);a=R(1,4);t=R(2,5);let s=v0*t+.5*a*t*t;push('Dráha',`v₀=${v0}, a=${a}, t=${t} (SI)`,'Urči dráhu.',[`${s} m`,`${v0+a*t} m`,`${v0*t+a*t*t} m`,`${.5*a*t*t} m`],0,'s=v₀t+½at².','Sečti rovnoměrnou a zrychlenou část dráhy.','Základní');push('Graf v(t)','Přímka v grafu rychlosti','Co udává její směrnice?',['Dráhu','Zrychlení','Polohu','Čas'],1,'Směrnice Δv/Δt je zrychlení.','Vzpomeň na definici a=Δv/Δt.','Základní');push('Graf v(t)','Plocha pod grafem v(t)','Co udává?',['Zrychlení','Posunutí','Hmotnost','Výkon'],1,'Integrální plocha pod rychlostí udává posunutí.','Jednotka plochy je (m/s)·s=m.','Základní');push('Znaménka','v>0 a a<0','Co se děje s velikostí rychlosti?',['Roste','Klesá','Je vždy nulová','Nelze rozhodnout'],1,'Rychlost a zrychlení mají opačná znaménka, těleso zpomaluje.','Porovnej znaménka v a.','Základní');push('Znaménka','v<0 a a<0','Co se děje s velikostí rychlosti?',['Roste','Klesá','Je nulová','Těleso stojí'],0,'Obě veličiny míří stejným směrem; |v| roste.','Záporné a nemusí znamenat zpomalování.','Základní');
for(let k=0;k<12;k++){let mode=k%4;if(mode===0){v0=R(5,20);v=R(v0+2,v0+15);t=R(2,8);a=(v-v0)/t;push('Výpočet zrychlení',`v₀=${v0} m/s, v=${v} m/s, t=${t} s`,'Urči a.',[`${fmt(a)} m/s²`,`${fmt((v+v0)/t)} m/s²`,`${fmt((v-v0)*t)} m/s²`,`0 m/s²`],0,`a=(v−v₀)/t=${fmt(a)} m/s².`,'Odečti počáteční rychlost od konečné a vyděl časem.','Střední')}else if(mode===1){v0=R(12,28);a=-R(2,7);t=-v0/a;push('Čas zastavení',`v₀=${v0} m/s, a=${a} m/s²`,'Kdy v=0?',[`${fmt(t)} s`,`${fmt(v0*Math.abs(a))} s`,`${fmt(Math.abs(a)/v0)} s`,`${fmt(v0/2)} s`],0,`0=v₀+at ⇒ t=${fmt(t)} s.`,'Polož konečnou rychlost rovnu nule.','Střední')}else if(mode===2){v0=R(5,15);v=v0+R(5,15);a=R(1,5);s=(v*v-v0*v0)/(2*a);push('Dráha bez času',`v₀=${v0}, v=${v}, a=${a} (SI)`,'Urči dráhu.',[`${fmt(s)} m`,`${fmt((v-v0)/a)} m`,`${fmt((v*v+v0*v0)/(2*a))} m`,`${fmt(v/a)} m`],0,`Z v²=v₀²+2as vyjde s=${fmt(s)} m.`,'Použij vztah bez času.','Střední')}else{let h=R(5,50),g=9.81;t=Math.sqrt(2*h/g);push('Volný pád',`h=${h} m, v₀=0, g=9,81 m/s²`,'Za jak dlouho těleso dopadne?',[`${fmt(t)} s`,`${fmt(h/g)} s`,`${fmt(Math.sqrt(h/g))} s`,`${fmt(g/h)} s`],0,`h=½gt² ⇒ t=√(2h/g)=${fmt(t)} s.`,'Vyjádři t z h=½gt².','Střední')}}
for(let k=0;k<12;k++){let mode=k%4;if(mode===0){let kmh=R(8,26)*5,r=R(5,18)/10,d=R(4,9),vv=kmh/3.6,sr=vv*r,sb=vv*vv/(2*d);push('Zastavovací dráha',`v=${kmh} km/h, reakce=${r} s, |a|=${d} m/s²`,'Urči celkovou dráhu.',[`${fmt(sr+sb)} m`,`${fmt(sb)} m`,`${fmt(sr)} m`,`${fmt(vv/d)} m`],0,`s=sᵣ+sᵦ=${fmt(sr)}+${fmt(sb)}=${fmt(sr+sb)} m.`,'Nejdřív převeď rychlost, pak sečti reakční a brzdnou dráhu.','Pokročilá')}else if(mode===1){v0=R(10,30);a=-R(2,8);let tt=-v0/a,ss=v0*tt+.5*a*tt*tt;push('Brzdění',`v₀=${v0} m/s, a=${a} m/s²`,'Urči brzdnou dráhu.',[`${fmt(ss)} m`,`${fmt(v0*tt)} m`,`${fmt(.5*Math.abs(a)*tt*tt)} m`,`${fmt(tt)} m`],0,`t=${fmt(tt)} s a s=${fmt(ss)} m; stejně vyjde −v₀²/(2a).`,'Nejprve čas zastavení, nebo použij vztah bez času.','Pokročilá')}else if(mode===2){let up=R(10,30),g=9.81,tt=up/g,h=up*up/(2*g);push('Vrh vzhůru',`v₀=${up} m/s, a=−g`,'Urči maximální výšku nad místem vrhu.',[`${fmt(h)} m`,`${fmt(up/g)} m`,`${fmt(up*up/g)} m`,`${fmt(.5*g*tt)} m`],0,`V nejvyšším bodě v=0; h=v₀²/(2g)=${fmt(h)} m.`,'Použij vztah v²=v₀²+2as s v=0.','Pokročilá')}else{let vv=R(5,20),aa=R(1,4),tt=R(2,6),ss=vv*tt+.5*aa*tt*tt,avg=ss/tt;push('Průměrná rychlost',`v₀=${vv}, a=${aa}, t=${tt} (SI)`,'Urči průměrnou rychlost.',[`${fmt(avg)} m/s`,`${fmt(vv+aa*tt)} m/s`,`${fmt(ss)} m/s`,`${fmt(aa*tt)} m/s`],0,`v̄=s/t=${fmt(ss)}/${tt}=${fmt(avg)} m/s.`,'Při stálém a také platí v̄=(v₀+v)/2.','Pokročilá')}}return q}
let set=[],i=0,choice=null,points=0,log=[];function start(){set=make();i=choice=points=0;log=[];$('#result').hidden=true;$('#quiz').hidden=false;show()}function show(){let q=set[i];choice=null;$('#bar').style.width=`${i/36*100}%`;$('#meta').textContent=`Úloha ${i+1}/36 · ${q.l} · ${points} bodů`;$('#topic').textContent=q.t;$('#formula').textContent=q.f;$('#prompt').textContent=q.p;$('#feedback').className='';$('#feedback').textContent='';$('#answers').innerHTML='';q.o.forEach((x,n)=>{let b=document.createElement('button');b.textContent=`${'ABCD'[n]}. ${x}`;b.onclick=()=>{choice=n;document.querySelectorAll('.answers button').forEach(y=>y.classList.remove('sel'));b.classList.add('sel');$('#check').disabled=false};$('#answers').append(b)});$('#check').hidden=false;$('#check').disabled=true;$('#next').hidden=true;$('#hint').hidden=false}function hint(){let q=set[i],f=$('#feedback');f.className='feedback';f.style.background='#fff7ed';f.textContent='Nápověda: '+q.h}function check(){let q=set[i],ok=choice===q.a;if(ok)points+=2;log.push([q.t,q.f,ok?'správně':'chybně',q.o[choice],q.o[q.a]]);document.querySelectorAll('.answers button').forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add('good');else if(n===choice)b.classList.add('bad')});let f=$('#feedback');f.style.background='';f.className='feedback '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Správně.':'Ještě ne.'}</b> ${q.e}`;$('#check').hidden=true;$('#hint').hidden=true;$('#next').hidden=false}function next(){if(++i<36)show();else finish()}function finish(){$('#quiz').hidden=true;$('#result').hidden=false;let p=Math.round(points/72*100);$('#score').textContent=points;$('#pct').textContent=p+' %';$('#rating').textContent=p>=85?'výborné':p>=70?'dobré':p>=50?'základní':'procvičit';$('#advice').textContent=p>=70?'Máš pevný základ. Zopakuj chybné úlohy s jednotkami a znaménky.':'Vrať se k interaktivnímu zápisu a projdi univerzální postup slovní úlohy.'}function csv(){let rows=[['téma','zadání','stav','odpověď','správně'],...log].map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows],{type:'text/csv;charset=utf-8'}));a.download='self-check-zrychleni.csv';a.click()}$('#hint').onclick=hint;$('#check').onclick=check;$('#next').onclick=next;$('#again').onclick=start;$('#csv').onclick=csv;start();</script></body></html>
