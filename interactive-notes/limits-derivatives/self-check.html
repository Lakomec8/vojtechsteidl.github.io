<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Self-check – limity a derivace</title><style>:root{--ink:#102a43;--muted:#627d98;--blue:#2563eb;--green:#047857;--red:#b91c1c;--line:#d9e2ec}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:28px auto 70px}.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,32px);margin:16px 0}.hero{background:linear-gradient(135deg,#eff6ff,#ecfdf5)}h1{font-size:clamp(28px,5vw,46px);margin:.15em 0}.tag{font-weight:800;color:#1d4ed8}.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#0f766e);width:0}.formula{font:700 22px Georgia,serif;background:#f8fafc;padding:16px;border-radius:12px;margin:14px 0;overflow:auto}.answers{display:grid;gap:10px}.answers button{padding:13px;text-align:left;background:#fff;border:1px solid #b8c6d9;border-radius:12px;font:inherit;cursor:pointer}.answers button:hover,.answers button.sel{border-color:var(--blue);background:#eff6ff}.answers button.good{border-color:#10b981;background:#ecfdf5}.answers button.bad{border-color:#ef4444;background:#fef2f2}.actions{display:flex;gap:10px;margin-top:16px}.actions button,.link{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.feedback{padding:14px;border-radius:12px;margin-top:14px}.ok{background:#ecfdf5;color:var(--green)}.no{background:#fef2f2;color:var(--red)}.muted{color:var(--muted)}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{background:#f8fafc;border-radius:14px;padding:16px;text-align:center}.stat b{font-size:30px;display:block}</style></head><body><main class="wrap"><section class="box hero"><span class="tag">30 úloh · 60 bodů · 3 úrovně</span><h1>Limity a derivace — self-check</h1><p>Náhodné pořadí, okamžitá zpětná vazba a vysvětlení každého výsledku.</p><a class="link" href="index.html">← Interaktivní zápis</a></section><section class="box" id="quiz"><div class="progress"><i id="bar"></i></div><p id="meta" class="muted"></p><h2 id="title"></h2><div id="formula" class="formula"></div><p id="prompt"></p><div id="answers" class="answers"></div><div id="feedback"></div><div class="actions"><button id="check" disabled>Zkontrolovat</button><button id="next" hidden>Další</button></div></section><section class="box" id="result" hidden><h2>Výsledek</h2><div class="result-grid"><div class="stat"><b id="score"></b>bodů z 60</div><div class="stat"><b id="pct"></b>úspěšnost</div><div class="stat"><b id="level"></b>úroveň</div></div><p id="advice"></p><div class="actions"><button id="again">Nová sada</button><button id="csv">Export CSV</button></div></section></main><script>const $=s=>document.querySelector(s),Q=(t,f,p,o,a,e,l)=>({t,f,p,o,a,e,l});let questions=[
Q('Hodnota a limita','lim x→1 (x²−1)/(x−1)','Urči limitu.',['0','1','2','Neexistuje'],2,'Rozlož (x−1)(x+1), zkrať a dosaď: 2.','Základní'),Q('Jednostranné limity','lim x→0⁻ 1/x','Urči limitu zleva.',['+∞','−∞','0','1'],1,'Pro záporná x blízká nule je 1/x záporné s rostoucí velikostí.','Základní'),Q('Spojitost','lim x→2 (3x²−2)','Vypočítej.',['8','10','12','Neexistuje'],1,'Polynom je spojitý: 3·2²−2=10.','Základní'),Q('Neurčitý tvar','Po dosazení vyjde 0/0','Co to znamená?',['Výsledek 0','Výsledek 1','Je nutná další úprava','Limita vždy neexistuje'],2,'0/0 je neurčitý tvar, nikoli výsledek.','Základní'),Q('Racionalizace','lim x→0 (√(x+4)−2)/x','Urči limitu.',['1/2','1/4','2','4'],1,'Po rozšíření dostaneš 1/(√(x+4)+2) → 1/4.','Střední'),Q('Rozklad','lim x→3 (x²−9)/(x−3)','Urči limitu.',['3','6','9','Neexistuje'],1,'x²−9=(x−3)(x+3), po zkrácení limita 6.','Základní'),Q('Nekonečno','lim x→∞ (2x+3)/(x+1)','Urči limitu.',['0','1','2','∞'],2,'Podíl vedoucích koeficientů je 2.','Základní'),Q('Nekonečno','lim x→∞ (3x²−x)/(2x²+5)','Urči limitu.',['2/3','3/2','3','∞'],1,'Stupně jsou stejné, podíl vedoucích koeficientů je 3/2.','Střední'),Q('Goniometrická limita','lim x→0 sin(5x)/x','Urči limitu.',['0','1','5','∞'],2,'5·sin(5x)/(5x) → 5.','Střední'),Q('Exponenciální limita','lim x→0 (e^(2x)−1)/x','Urči limitu.',['1/2','1','2','e²'],2,'Substituce u=2x dává násobek 2.','Pokročilá'),Q('Logaritmická limita','lim x→0 ln(1+3x)/x','Urči limitu.',['1/3','1','3','∞'],2,'ln(1+u)/u→1 a u=3x, tedy 3.','Pokročilá'),Q('Svislá asymptota','lim x→2⁺ 1/(x−2)','Urči jednostrannou limitu.',['−∞','0','+∞','2'],2,'Jmenovatel jde k nule kladnými hodnotami.','Střední'),Q('Oboustranná limita','Levá limita = 1, pravá limita = 3','Co platí?',['Limita je 1','Limita je 2','Limita je 3','Oboustranná limita neexistuje'],3,'Jednostranné limity se neshodují.','Základní'),Q('L’Hôpital','lim x→0 (1−cos x)/x²','Urči limitu.',['0','1/2','1','∞'],1,'Dvakrát L’Hôpital nebo identita dává 1/2.','Pokročilá'),Q('Volba metody','lim x→0 (√(x+9)−3)/x','Která metoda je nejpřímější?',['Rozklad na součin','Sdružený výraz','Integrace','Substituce x=∞'],1,'Odmocninový rozdíl racionalizuj sdruženým výrazem.','Základní'),
Q('Mocninné pravidlo','d/dx (3x⁴−2x+7)','Urči derivaci.',['12x³−2','12x⁴−2','3x³−2','12x³+7'],0,'(xⁿ)′=nxⁿ⁻¹ a konstanta má derivaci 0.','Základní'),Q('Součinové pravidlo','d/dx [(x²+1)(x−3)]','Vyber správně.',['2x(x−3)+(x²+1)','2x(x−3)','(2x+1)(1−3)','x²−3'],0,'(uv)′=u′v+uv′.','Střední'),Q('Podílové pravidlo','d/dx [(x²+1)/(x−1)]','Vyber čitatele derivace.',['2x(x−1)+(x²+1)','2x(x−1)−(x²+1)','2x−1','x²−1'],1,'Čitatel je u′v−uv′.','Střední'),Q('Řetězové pravidlo','d/dx sin(3x)','Urči derivaci.',['cos(3x)','3sin(3x)','3cos(3x)','−3cos(3x)'],2,'Derivace vnější cos(3x) krát derivace vnitřní 3.','Základní'),Q('Řetězové pravidlo','d/dx e^(x²)','Urči derivaci.',['e^(2x)','2x·e^(x²)','x²e^x','2e^(x²)'],1,'Derivace e^u je e^u·u′.','Střední'),Q('Logaritmus','d/dx ln(2x+1)','Urči derivaci.',['1/(2x+1)','2/(2x+1)','ln 2','2ln(2x+1)'],1,'(ln u)′=u′/u.','Střední'),Q('Odmocnina','d/dx √(x²+4)','Urči derivaci.',['2x/√(x²+4)','x/√(x²+4)','1/(2√(x²+4))','√(2x)'],1,'Derivace √u je u′/(2√u); dvojky se zkrátí.','Pokročilá'),Q('Tečna','f(x)=x², a=2','Jaká je tečna?',['y=2x','y=4x−4','y=4x+4','y=x+2'],1,'f(2)=4 a f′(2)=4: y−4=4(x−2).','Střední'),Q('Normála','Tečna má směrnici 4','Jaká je směrnice normály?',['4','−4','1/4','−1/4'],3,'Kolmé nenulové směrnice mají součin −1.','Střední'),Q('Stacionární body','f(x)=x³−3x','Kde je f′(x)=0?',['x=0','x=±1','x=±3','Nikde'],1,'f′=3x²−3=3(x²−1).','Střední'),Q('Monotónnost','f(x)=x²−4x','Kde funkce roste?',['(−∞,2)','(2,∞)','Všude','Nikde'],1,'f′=2x−4 je kladná pro x>2.','Základní'),Q('Lokální extrém','f′ mění znaménko z + na −','Co nastává?',['Lokální minimum','Lokální maximum','Inflexe vždy','Žádný extrém'],1,'Funkce nejprve roste a potom klesá.','Základní'),Q('Druhá derivace','f′(a)=0 a f″(a)>0','Co lze při hladkosti uzavřít?',['Lokální minimum','Lokální maximum','Svislá asymptota','Nic'],0,'Kladná druhá derivace znamená lokální konvexitu a minimum.','Pokročilá'),Q('Logaritmické derivování','y=x^x, x>0','Jaká je derivace?',['x^(x−1)','x^x','x^x(ln x+1)','ln x+1'],2,'ln y=x ln x; y′/y=ln x+1.','Pokročilá'),Q('Derivace z definice','[f(a+h)−f(a)]/h','K čemu se výraz blíží pro h→0?',['f(a)','f′(a)','f″(a)','0 vždy'],1,'Jde o definiční limitu derivace.','Základní')];
let set=[],i=0,choice=null,points=0,log=[];function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){set=shuffle(questions);i=0;choice=null;points=0;log=[];$('#result').hidden=true;$('#quiz').hidden=false;show()}function show(){let q=set[i];choice=null;$('#bar').style.width=`${i/30*100}%`;$('#meta').textContent=`Úloha ${i+1}/30 · ${q.l} · ${points} bodů`;$('#title').textContent=q.t;$('#formula').textContent=q.f;$('#prompt').textContent=q.p;$('#feedback').className='';$('#feedback').textContent='';$('#answers').innerHTML='';q.o.forEach((x,n)=>{let b=document.createElement('button');b.textContent=`${'ABCD'[n]}. ${x}`;b.onclick=()=>{choice=n;document.querySelectorAll('.answers button').forEach(y=>y.classList.remove('sel'));b.classList.add('sel');$('#check').disabled=false};$('#answers').append(b)});$('#check').hidden=false;$('#check').disabled=true;$('#next').hidden=true}function check(){let q=set[i],ok=choice===q.a;if(ok)points+=2;log.push([q.t,q.f,ok?'správně':'chybně',q.o[choice],q.o[q.a]]);document.querySelectorAll('.answers button').forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add('good');else if(n===choice)b.classList.add('bad')});let f=$('#feedback');f.className='feedback '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Správně.':'Ještě ne.'}</b> ${q.e}`;$('#check').hidden=true;$('#next').hidden=false}function next(){if(++i<30)show();else finish()}function finish(){$('#quiz').hidden=true;$('#result').hidden=false;let p=Math.round(points/60*100);$('#score').textContent=points;$('#pct').textContent=p+' %';$('#level').textContent=p>=85?'výborná':p>=70?'pevná':p>=50?'základní':'k doplnění';$('#advice').textContent=p>=70?'Dobrá práce. Projdi si hlavně chybné otázky a zkus novou sadu.':'Vrať se k interaktivnímu zápisu, zejména k volbě metody a řetězovému pravidlu.'}function csv(){let rows=[['téma','zadání','stav','odpověď','správně'],...log].map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows],{type:'text/csv;charset=utf-8'}));a.download='self-check-limity-derivace.csv';a.click()}$('#check').onclick=check;$('#next').onclick=next;$('#again').onclick=start;$('#csv').onclick=csv;start();</script></body></html>
