name: Audit student portal data

on:
  push:
    branches:
      - fix/latest-material-dashboard
    paths:
      - ".ops/student-portal-audit-trigger"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install portal dependencies
        working-directory: cloudflare-portal
        run: npm install --no-audit --no-fund

      - name: Audit production D1 student profiles
        run: node cloudflare-portal/scripts/audit-student-portal.mjs

      - name: Audit production planned calendar mappings
        working-directory: cloudflare-portal
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "
            SELECT e.google_event_id,
                   e.summary,
                   e.starts_at,
                   e.ends_at,
                   e.status,
                   e.student_id AS primary_student_id,
                   GROUP_CONCAT(es.student_id) AS participant_ids,
                   GROUP_CONCAT(ts.display_name) AS participant_names,
                   e.last_synced_at
              FROM tutoring_calendar_events AS e
              LEFT JOIN tutoring_calendar_event_students AS es
                ON es.google_event_id = e.google_event_id
              LEFT JOIN tutoring_students AS ts
                ON ts.id = es.student_id
             WHERE e.starts_at >= '2026-09-04T00:00:00.000Z'
               AND e.starts_at < '2026-09-21T00:00:00.000Z'
             GROUP BY e.google_event_id
             ORDER BY e.starts_at, e.google_event_id;
          "
