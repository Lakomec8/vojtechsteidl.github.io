name: Polish premium pricing label

# One-time workflow: applies the CSS fix and removes itself.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/polish-premium-label.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-label:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move premium label inside the card
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")

          card_line = "            overflow: hidden;\n"
          card_replacement = card_line + "            padding-top: 3.75rem;\n"
          badge_line = "        .premium-plan .recommended {\n"
          badge_replacement = (
              badge_line
              + "            top: 1rem;\n"
              + "            min-width: max-content;\n"
              + "            white-space: nowrap;\n"
          )

          if "padding-top: 3.75rem;" not in content:
              if card_line not in content:
                  raise SystemExit("Premium card overflow line was not found.")
              content = content.replace(card_line, card_replacement, 1)

          if ".premium-plan .recommended {\n            top: 1rem;" not in content:
              if badge_line not in content:
                  raise SystemExit("Premium badge selector was not found.")
              content = content.replace(badge_line, badge_replacement, 1)

          path.write_text(content, encoding="utf-8")
          Path(".github/workflows/polish-premium-label.yml").unlink()
          PY

      - name: Commit polished pricing card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/polish-premium-label.yml
          git commit -m "Doladit štítek prémiového balíčku"
          git pull --rebase origin main
          git push origin HEAD:main
