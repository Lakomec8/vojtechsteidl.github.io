name: Validate Cloudflare portal

on:
  pull_request:
    paths:
      - "cloudflare-portal/**"
      - "assets/student-self-checks.js"
      - "assets/student-portal.css"
      - ".github/workflows/validate-cloudflare-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-portal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install portal dependencies
        run: npm install --no-audit --no-fund

      - name: Validate controlled test fixture
        run: npm run test:fixtures

      - name: Syntax-check production maintenance scripts
        run: |
          node --check scripts/apply-profile-patch.mjs
          node --check scripts/migrate-materials-to-r2.mjs
          node --check ../assets/student-self-checks.js

      - name: Apply and verify local database migrations
        run: |
          npm run db:migrate:local
          npx wrangler d1 execute DB --local --command "SELECT (SELECT COUNT(*) FROM self_check_tests WHERE status = 'published') AS tests, (SELECT COUNT(*) FROM self_check_questions) AS questions" --json > /tmp/self-check-seed.json
          node -e "const fs=require('node:fs');const rows=JSON.parse(fs.readFileSync('/tmp/self-check-seed.json','utf8'));const result=rows?.[0]?.results?.[0];if(Number(result?.tests)<1||Number(result?.questions)<8)process.exit(1)"
          npx wrangler d1 execute DB --local --command "SELECT (SELECT SUM(amount) FROM tutoring_income) AS revenue, (SELECT SUM(duration_minutes)/60 FROM (SELECT COALESCE(google_event_id,id) AS session_id, MAX(duration_minutes) AS duration_minutes FROM tutoring_lessons GROUP BY session_id)) AS hours, (SELECT COUNT(*) FROM tutoring_lessons) AS lessons, (SELECT COUNT(*) FROM tutoring_income) AS incomes, (SELECT COUNT(*) FROM tutoring_calendar_events WHERE status='completed') AS completed, (SELECT COUNT(*) FROM tutoring_calendar_events WHERE status='planned') AS planned, (SELECT COUNT(*) FROM (SELECT google_event_id, student_id FROM tutoring_lessons WHERE google_event_id IS NOT NULL GROUP BY google_event_id, student_id HAVING COUNT(*) > 1)) AS duplicates" --json > /tmp/tutoring-os-seed.json
          node -e "const fs=require('node:fs');const rows=JSON.parse(fs.readFileSync('/tmp/tutoring-os-seed.json','utf8'));const r=rows?.[0]?.results?.[0];if(Number(r?.revenue)!==8800||Number(r?.hours)!==21||Number(r?.lessons)!==20||Number(r?.incomes)!==20||Number(r?.completed)!==10||Number(r?.planned)!==26||Number(r?.duplicates)!==0)process.exit(1)"

      - name: Build private portal artifact
        run: npm run build

      - name: Typecheck Worker and bindings
        run: npm run typecheck
