name: Deploy GitHub Pages

# Publishes only the explicit public-site allowlist from main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Cloudflare Web Analytics on public pages
        run: python scripts/inject_analytics.py

      - name: Build hardened public artifact
        run: python scripts/build_public_site.py

      - name: Verify private student paths are absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .public-site/Materials
          test ! -e .public-site/students
          test ! -e .public-site/.uploads
          test ! -e .public-site/cloudflare-portal
          if find .public-site -maxdepth 1 -type f -iname '*.pdf' | grep -q .; then
            echo 'Unexpected PDF exposed at public artifact root.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
