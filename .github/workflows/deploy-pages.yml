name: Deploy GitHub Pages

# Publishes only the explicit public-site allowlist from main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build hardened public artifact
        run: python scripts/build_public_site.py

      - name: Publish online math tutoring landing page
        run: python scripts/publish_online_tutoring.py

      - name: Trim homepage secondary sections
        run: python scripts/trim_homepage.py

      - name: Keep navigation to one row or hamburger
        run: python scripts/patch_nav_layout.py

      - name: Verify private student paths are absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .public-site/Materials
          test ! -e .public-site/students
          test ! -e .public-site/.uploads
          test ! -e .public-site/cloudflare-portal
          if find .public-site -maxdepth 1 -type f -iname '*.pdf' | grep -q .; then
            echo 'Unexpected PDF exposed at public artifact root.' >&2
            exit 1
          fi
          grep -q 'responsive-nav-no-wrap' .public-site/style.css
          test -f .public-site/online-doucovani-matematiky/index.html
          test -f .public-site/doucovani-vs-matematiky/index.html
          test -f .public-site/priprava-na-prijimacky-z-matematiky/index.html
          grep -q '<link rel="canonical" href="https://vojtechsteidl.eu/">' .public-site/index.html
          grep -q 'doucovani-vs-matematiky' .public-site/index.html
          grep -q 'priprava-na-prijimacky-z-matematiky' .public-site/index.html
          ! grep -q 'id="pro-skoly"' .public-site/index.html
          ! grep -q 'id="faq"' .public-site/index.html
          ! grep -q 'href="#reference"' .public-site/index.html
          grep -q 'id="reference"' .public-site/index.html
          grep -q 'doucovani-vs-matematiky' .public-site/sitemap.xml
          grep -q 'online-doucovani-matematiky' .public-site/sitemap.xml
          grep -q 'priprava-na-prijimacky-z-matematiky' .public-site/sitemap.xml
          grep -q 'standardně za studenty nedojíždím' .public-site/doucovani-matematiky/index.html
          grep -q 'test-vs-matematika-1-rocnik' .public-site/doucovani-vs-matematiky/index.html
          grep -q 'test-prijimacky-9-matematika' .public-site/priprava-na-prijimacky-z-matematiky/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
