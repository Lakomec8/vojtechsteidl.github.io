name: Guard private student materials

on:
  pull_request:
    paths:
      - "Materials/**"
  push:
    paths:
      - "Materials/**"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reject added or modified public student materials
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            before="${{ github.event.pull_request.base.sha }}"
            after="${{ github.event.pull_request.head.sha }}"
          elif [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "$before" ]; then
            echo "No parent commit available."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only --diff-filter=AM "$before" "$after" -- 'Materials/**')
          if [ ${#changed[@]} -gt 0 ]; then
            printf 'Public student material upload is disabled. Use the authenticated admin portal / Cloudflare R2 instead.\nFiles:\n'
            printf ' - %s\n' "${changed[@]}"
            exit 1
          fi

          echo "No new or modified public student material files detected."
