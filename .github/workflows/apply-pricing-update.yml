name: Apply pricing update

on:
  push:
    branches:
      - agent/update-pricing-premium
    paths:
      - scripts/apply_pricing_update.py
      - .github/workflows/apply-pricing-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-pricing-premium
          fetch-depth: 0

      - name: Apply pricing changes
        run: python scripts/apply_pricing_update.py

      - name: Validate generated page
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          html = Path("index.html").read_text(encoding="utf-8")
          Parser().feed(html)

          required = [
              "450 Kč",
              "Prémiový balíček",
              "2 390 Kč",
              "Studium Plus",
              "studium-plus",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Vygenerovaná stránka postrádá: {missing}")

          if "400 Kč" in html:
              raise SystemExit("Na stránce zůstala stará cena 400 Kč.")
          PY
          python scripts/validate_student_data.py
          python scripts/validate_interactive_materials.py
          git diff --check

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update tutoring pricing and add Studium Plus"
          git push origin HEAD:agent/update-pricing-premium
