name: Apply pricing update

on:
  push:
    branches:
      - agent/update-pricing-premium
    paths:
      - scripts/apply_pricing_update.py
      - .github/workflows/apply-pricing-update.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply_pricing_update.py
      - .github/workflows/apply-pricing-update.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-pricing-premium
          fetch-depth: 0

      - name: Apply pricing changes
        run: python scripts/apply_pricing_update.py

      - name: Validate pricing content
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "450 Kč",
              "Prémiový balíček",
              "2 390 Kč",
              "Studium Plus",
              "studium-plus",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Vygenerovaná stránka postrádá: {missing}")

          start = html.find('<section class="pricing section" id="cenik">')
          end = html.find('</section>', start)
          if start < 0 or end < 0:
              raise SystemExit("Vygenerovaná stránka neobsahuje kompletní sekci ceníku.")
          if "400 Kč" in html[start:end]:
              raise SystemExit("V ceníku zůstala stará cena 400 Kč.")
          PY

      - name: Validate student data
        run: python scripts/validate_student_data.py

      - name: Validate interactive materials
        run: python scripts/validate_interactive_materials.py

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update tutoring pricing and add Studium Plus"
          git push origin HEAD:agent/update-pricing-premium
