name: Apply chronology code fix

on:
  push:
    branches:
      - fix/latest-material-dashboard
    paths:
      - ".ops/apply-chronology-code-fix"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/latest-material-dashboard
          fetch-depth: 0

      - name: Apply code patches
        run: |
          python scripts/apply_chronology_code_fix.py
          python scripts/patch_profile_chronology_normalizer.py
          python scripts/patch_history_logic.py

      - name: Commit code changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/student-portal.js assets/student-dashboard-featured.js cloudflare-portal/src/entry.ts cloudflare-portal/scripts/apply-profile-patch.mjs
          if git diff --cached --quiet; then
            echo "Chronology code is already normalized."
            exit 0
          fi
          git commit -m "Unify student lesson chronology"
          git pull --rebase origin fix/latest-material-dashboard
          git push origin HEAD:fix/latest-material-dashboard
