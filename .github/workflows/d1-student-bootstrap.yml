name: One-time encrypted D1 bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/d1-student-bootstrap.yml"
      - ".github/scripts/d1-student-bootstrap.mjs"
      - ".ops/d1-student-bootstrap.json"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare or apply encrypted bootstrap
        run: node .github/scripts/d1-student-bootstrap.mjs
