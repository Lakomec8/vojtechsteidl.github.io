name: Expand interactive lab

on:
  push:
    paths:
      - '.github/workflows/expand-interactive-lab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch interactive lesson layout
        shell: python
        run: |
          from pathlib import Path
          path = Path('interactive-notes/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* wide-lab-layout-v2 */'
          if marker not in text:
              css = r'''
          /* wide-lab-layout-v2 */
          @media (min-width:1181px){
            .lesson-layout{width:min(1500px,calc(100% - 2.5rem));grid-template-columns:220px minmax(0,1fr)}
            .lab{margin:2rem 0 3rem}
            .lab-body{grid-template-columns:minmax(350px,400px) minmax(0,1fr);align-items:start}
            .control-panel{display:flex;min-width:0;flex-direction:column;gap:.72rem}
            .current-formula{grid-row:auto;min-height:145px;padding:1.25rem 1.35rem}
            .presets,.replay{grid-column:auto}
            .canvas-wrap{height:420px}
          }
          '''
              text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text, encoding='utf-8')
          workflow = Path('.github/workflows/expand-interactive-lab.yml')
          if workflow.exists():
              workflow.unlink()
      - name: Commit layout patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-notes/index.html .github/workflows/expand-interactive-lab.yml
          git commit -m "Use wider side-by-side interactive lab" || exit 0
          git push
