name: Apply historical lesson offset UI

on:
  push:
    branches:
      - fix/historical-lesson-offset
    paths:
      - ".ops/apply-historical-lesson-offset-ui"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-lesson-offset
          fetch-depth: 0
      - name: Apply dashboard patch
        run: python scripts/apply_historical_lesson_offset_ui.py
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/student-portal.js
          git commit -m "Support historical lesson count offsets"
          git pull --rebase origin fix/historical-lesson-offset
          git push origin HEAD:fix/historical-lesson-offset
