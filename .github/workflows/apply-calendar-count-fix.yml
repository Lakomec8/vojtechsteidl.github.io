name: Apply calendar-only lesson count fix

on:
  push:
    branches:
      - fix/calendar-only-lesson-count
    paths:
      - ".ops/apply-calendar-count-fix"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-only-lesson-count
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_calendar_score_filter.py
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/student-portal.js
          git commit -m "Align assessments with calendar lessons"
          git pull --rebase origin fix/calendar-only-lesson-count
          git push origin HEAD:fix/calendar-only-lesson-count
