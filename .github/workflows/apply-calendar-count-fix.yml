name: Apply calendar-only lesson count fix

on:
  push:
    branches:
      - fix/calendar-only-lesson-count
    paths:
      - ".ops/apply-calendar-count-fix"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-only-lesson-count
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_calendar_event_count_fix.py
      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/student-portal.js cloudflare-portal/src/entry.ts cloudflare-portal/scripts/apply-profile-patch.mjs cloudflare-portal/scripts/audit-student-portal.mjs
          git commit -m "Count completed lessons from calendar events"
          git pull --rebase origin fix/calendar-only-lesson-count
          git push origin HEAD:fix/calendar-only-lesson-count
