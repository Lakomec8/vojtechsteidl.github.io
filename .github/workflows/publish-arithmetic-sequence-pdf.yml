name: Publish arithmetic-sequence PDF to materials library
on:
  push:
    branches: [main]
    paths:
      - "docs/overleaf/aritmeticka-posloupnost/main.tex"
      - ".github/workflows/publish-arithmetic-sequence-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-arithmetic-sequence-library-pdf
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile existing Overleaf notes
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: docs/overleaf/aritmeticka-posloupnost
          root_file: main.tex
          compiler: latexmk
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Verify PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/overleaf/aritmeticka-posloupnost/main.pdf
          file docs/overleaf/aritmeticka-posloupnost/main.pdf | grep -q 'PDF document'
      - name: Install Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install portal dependencies
        working-directory: cloudflare-portal
        run: npm install --no-audit --no-fund
      - name: Upload master PDF to library R2, without assigning students
        working-directory: cloudflare-portal
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler r2 object put "vojtechsteidl-student-materials/library/matematika/Aritmeticka_posloupnost_-_noty.pdf" \
            --remote --content-type "application/pdf" \
            --file "../docs/overleaf/aritmeticka-posloupnost/main.pdf"
          npx wrangler r2 object get "vojtechsteidl-student-materials/library/matematika/Aritmeticka_posloupnost_-_noty.pdf" \
            --remote --file "/tmp/aritmeticka-posloupnost-library-verified.pdf"
          cmp "../docs/overleaf/aritmeticka-posloupnost/main.pdf" "/tmp/aritmeticka-posloupnost-library-verified.pdf"
      - name: Archive generated PDF for deployment diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: aritmeticka-posloupnost-noty
          path: docs/overleaf/aritmeticka-posloupnost/main.pdf
          retention-days: 7
