name: Validate public site boundary

on:
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "assets/**"
      - "doucovani-fyziky/**"
      - "doucovani-matematiky/**"
      - "doucovani-vs-matematiky/**"
      - "online-doucovani-matematiky/**"
      - "skupinove-doucovani-matematiky/**"
      - "skupiny/**"
      - "priprava-na-prijimacky-z-matematiky/**"
      - "priprava-na-maturitu-z-matematiky/**"
      - "pro-skoly/**"
      - "interactive-notes/**"
      - "materialy-zdarma/**"
      - "sitemap.xml"
      - "scripts/build_public_site.py"
      - "scripts/publish_online_tutoring.py"
      - "scripts/compact_homepage.py"
      - "scripts/patch_nav_layout.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/validate-public-site.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "assets/**"
      - "doucovani-fyziky/**"
      - "doucovani-matematiky/**"
      - "doucovani-vs-matematiky/**"
      - "online-doucovani-matematiky/**"
      - "skupinove-doucovani-matematiky/**"
      - "skupiny/**"
      - "priprava-na-prijimacky-z-matematiky/**"
      - "priprava-na-maturitu-z-matematiky/**"
      - "pro-skoly/**"
      - "interactive-notes/**"
      - "materialy-zdarma/**"
      - "sitemap.xml"
      - "scripts/build_public_site.py"
      - "scripts/publish_online_tutoring.py"
      - "scripts/compact_homepage.py"
      - "scripts/patch_nav_layout.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/validate-public-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build explicit public allowlist
        run: python scripts/build_public_site.py

      - name: Publish online math tutoring landing page
        run: python scripts/publish_online_tutoring.py

      - name: Build compact homepage
        run: python scripts/compact_homepage.py

      - name: Test unified calendar booking and customer registration
        run: |
          node --check assets/public-capacity.js
          node scripts/test-integrated-booking.mjs

      - name: Apply responsive navigation patch
        run: python scripts/patch_nav_layout.py

      - name: Assert private tutoring data is not published
        shell: bash
        run: |
          set -euxo pipefail
          forbidden=(Materials students .uploads .student-updates cloudflare-portal docs scripts .github)
          for path in "${forbidden[@]}"; do
            if [ -e ".public-site/$path" ]; then
              echo "Forbidden path in public artifact: $path" >&2
              exit 1
            fi
          done
          if find .public-site -maxdepth 1 -type f -iname '*.pdf' | grep -q .; then
            echo "Unexpected root PDF in public artifact" >&2
            exit 1
          fi
          test -f .public-site/skupinove-doucovani-matematiky/index.html
          test -f .public-site/skupiny/index.html
          test -f .public-site/online-doucovani-matematiky/index.html
          test -f .public-site/doucovani-vs-matematiky/index.html
          test -f .public-site/priprava-na-prijimacky-z-matematiky/index.html
          grep -q '<link rel="canonical" href="https://vojtechsteidl.eu/">' .public-site/index.html
          grep -q 'doucovani-vs-matematiky' .public-site/index.html
          grep -q 'priprava-na-prijimacky-z-matematiky' .public-site/index.html
          grep -q '/skupiny/' .public-site/index.html
          grep -q 'blue-spacious-homepage-v2' .public-site/index.html
          grep -q 'class="nav-student"' .public-site/index.html
          grep -q 'href="/student-portal/" rel="nofollow"' .public-site/index.html
          ! grep -q 'https://portal.vojtechsteidl.eu' .public-site/index.html
          grep -q 'id="weeklyCalendar"' .public-site/index.html
          grep -q 'class="blue-capacity-standalone" id="kapacita"' .public-site/index.html
          ! grep -q 'blue-capacity-in-zone' .public-site/index.html
          grep -q 'Dostupnost termínů ověřuji' .public-site/index.html
          ! grep -q 'data-slot-id="mon-1745"' .public-site/index.html
          grep -q 'calendar-time-track' .public-site/index.html
          grep -q 'grid-template-columns:repeat(5,minmax(175px,1fr))' .public-site/index.html
          grep -q 'name="booking_type" value="diagnostic_30"' .public-site/index.html
          grep -q 'name="booking_type" value="lesson_60"' .public-site/index.html
          grep -q 'id="bookingStartAt"' .public-site/index.html
          grep -q 'src="/assets/public-capacity.js"' .public-site/index.html
          grep -q 'window.setInterval(refreshCapacity, refreshIntervalMs)' .public-site/assets/public-capacity.js
          grep -q 'https://capacity.vojtechsteidl.eu' .public-site/assets/public-capacity.js
          grep -q '/api/public-capacity' .public-site/assets/public-capacity.js
          grep -q '/api/public-bookings' .public-site/assets/public-capacity.js
          grep -q 'renderTimeline(data.slots, data.week)' .public-site/assets/public-capacity.js
          test -f .public-site/assets/previews/zs-slovni-ulohy.webp
          test -f .public-site/assets/previews/ss-geometrie.webp
          grep -q '/assets/previews/zs-slovni-ulohy.webp' .public-site/index.html
          grep -q '/assets/previews/ss-geometrie.webp' .public-site/index.html
          test -f .public-site/assets/previews/vs-integraly.webp
          grep -q '/assets/previews/vs-integraly.webp' .public-site/index.html
          grep -q 'Ukázka · integrály' .public-site/index.html
          ! grep -q 'vs-material-sheet' .public-site/index.html
          grep -q 'id="jak-to-funguje"' .public-site/index.html
          grep -q '<h2>Studentská zóna – ukázka</h2>' .public-site/index.html
          grep -q 'id="o-lektorovi"' .public-site/index.html
          grep -q 'Bc. Vojtěch Steidl, MBA' .public-site/index.html
          test -f .public-site/ochrana-osobnich-udaju/index.html
          grep -q 'href="/ochrana-osobnich-udaju/"' .public-site/index.html
          test -f .public-site/podminky-doucovani/index.html
          grep -q 'href="/podminky-doucovani/"' .public-site/index.html
          grep -q 'id="rezervace-terminu"' .public-site/index.html
          grep -q 'class="booking-panel" id="rezervace-terminu"' .public-site/index.html
          grep -q 'renderBookingOptions' .public-site/assets/public-capacity.js
          grep -q 'id="bookingTypeSummary"' .public-site/index.html
          grep -q 'Rezervace termínu' .public-site/index.html
          ! grep -q 'id="contactForm"' .public-site/index.html
          grep -q 'class="blue-hero-bio"' .public-site/index.html
          grep -q 'id="heroBioName"' .public-site/index.html
          ! grep -q '728345633' .public-site/index.html
          grep -q 'mailto:info@vojtechsteidl.eu' .public-site/index.html
          grep -q 'info@vojtechsteidl.eu' .public-site/ochrana-osobnich-udaju/index.html
          grep -q 'info@vojtechsteidl.eu' .public-site/podminky-doucovani/index.html
          if grep -R -n -F 'vojtasteidl@seznam.cz' .public-site --include='*.html' --include='*.js'; then
            echo 'Legacy personal email exposed in public site' >&2
            exit 1
          fi
          grep -q 'blue-ecosystem-frame' .public-site/index.html
          ! grep -q '<section class="school-promo-section" id="diagnostika">' .public-site/index.html
          ! grep -q 'id="materialy"' .public-site/index.html
          ! grep -q 'id="pro-skoly"' .public-site/index.html
          ! grep -q 'id="faq"' .public-site/index.html
          ! grep -q 'href="#reference"' .public-site/index.html
          grep -q 'id="reference"' .public-site/index.html
          grep -q 'doucovani-vs-matematiky' .public-site/sitemap.xml
          grep -q 'online-doucovani-matematiky' .public-site/sitemap.xml
          grep -q 'priprava-na-prijimacky-z-matematiky' .public-site/sitemap.xml
          grep -q 'Standardně učím online po celé ČR' .public-site/doucovani-matematiky/index.html
          ! grep -q 'Výuka probíhá pouze online' .public-site/doucovani-matematiky/index.html
          ! grep -q 'Ne. Výuka probíhá pouze online' .public-site/online-doucovani-matematiky/index.html
          grep -q 'test-vs-matematika-1-rocnik' .public-site/doucovani-vs-matematiky/index.html
          grep -q 'test-prijimacky-9-matematika' .public-site/priprava-na-prijimacky-z-matematiky/index.html
          grep -q 'responsive-nav-no-wrap' .public-site/style.css
