name: Validate public site boundary

on:
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "assets/**"
      - "doucovani-fyziky/**"
      - "doucovani-matematiky/**"
      - "online-doucovani-matematiky/**"
      - "skupinove-doucovani-matematiky/**"
      - "priprava-na-prijimacky-z-matematiky/**"
      - "priprava-na-maturitu-z-matematiky/**"
      - "pro-skoly/**"
      - "interactive-notes/**"
      - "materialy-zdarma/**"
      - "sitemap.xml"
      - "scripts/build_public_site.py"
      - "scripts/publish_online_tutoring.py"
      - "scripts/patch_nav_layout.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/validate-public-site.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "assets/**"
      - "doucovani-fyziky/**"
      - "doucovani-matematiky/**"
      - "online-doucovani-matematiky/**"
      - "skupinove-doucovani-matematiky/**"
      - "priprava-na-prijimacky-z-matematiky/**"
      - "priprava-na-maturitu-z-matematiky/**"
      - "pro-skoly/**"
      - "interactive-notes/**"
      - "materialy-zdarma/**"
      - "sitemap.xml"
      - "scripts/build_public_site.py"
      - "scripts/publish_online_tutoring.py"
      - "scripts/patch_nav_layout.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/validate-public-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build explicit public allowlist
        run: python scripts/build_public_site.py

      - name: Publish online math tutoring landing page
        run: python scripts/publish_online_tutoring.py

      - name: Apply responsive navigation patch
        run: python scripts/patch_nav_layout.py

      - name: Assert private tutoring data is not published
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(Materials students .uploads .student-updates cloudflare-portal docs scripts .github)
          for path in "${forbidden[@]}"; do
            if [ -e ".public-site/$path" ]; then
              echo "Forbidden path in public artifact: $path" >&2
              exit 1
            fi
          done
          if find .public-site -maxdepth 1 -type f -iname '*.pdf' | grep -q .; then
            echo "Unexpected root PDF in public artifact" >&2
            exit 1
          fi
          test -f .public-site/skupinove-doucovani-matematiky/index.html
          test -f .public-site/online-doucovani-matematiky/index.html
          test -f .public-site/priprava-na-prijimacky-z-matematiky/index.html
          grep -q 'skupinove-doucovani-matematiky' .public-site/index.html
          grep -q 'online-doucovani-matematiky' .public-site/sitemap.xml
          grep -q 'priprava-na-prijimacky-z-matematiky' .public-site/sitemap.xml
          grep -q 'online-doucovani-matematiky' .public-site/doucovani-matematiky/index.html
          grep -q 'test-prijimacky-9-matematika' .public-site/priprava-na-prijimacky-z-matematiky/index.html
          grep -q 'responsive-nav-no-wrap' .public-site/style.css
