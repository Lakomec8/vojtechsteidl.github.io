name: Assemble PDF upload

on:
  push:
    paths:
      - ".uploads/**/READY"

permissions:
  contents: write

concurrency:
  group: assemble-pdf-upload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble queued PDFs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          ready_files=(.uploads/*/READY)
          if [ ${#ready_files[@]} -eq 0 ]; then
            echo "No READY upload found."
            exit 0
          fi

          for ready in "${ready_files[@]}"; do
            upload_dir="$(dirname "$ready")"
            target="$(tr -d '\r\n' < "$ready")"

            if [[ ! "$target" =~ ^Materials/[A-Za-z0-9._-]+/.+\.pdf$ ]]; then
              echo "Invalid target path: $target" >&2
              exit 1
            fi

            student_id="$(echo "$target" | cut -d/ -f2)"
            profile="students/${student_id}.json"
            if [ ! -f "$profile" ]; then
              echo "Missing student profile: $profile" >&2
              exit 1
            fi

            mkdir -p "$(dirname "$target")"
            cat "$upload_dir"/part-*.b64 | base64 --decode > "$target"

            python -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); d=json.loads(p.read_text(encoding="utf-8")); lessons=d.get("lessons", []); d.setdefault("completedLessonsCount", len(lessons)); d["incrementLessonCountOnMaterialAdd"]=True; p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")' "$profile"

            rm -rf "$upload_dir"
            echo "Assembled $target"
          done

      - name: Synchronize materials and lesson counts
        run: python scripts/sync_student_materials.py

      - name: Validate student data
        run: python scripts/validate_student_data.py

      - name: Commit assembled PDF and generated dashboard updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated student PDF"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
