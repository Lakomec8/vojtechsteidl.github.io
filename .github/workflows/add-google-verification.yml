name: Add Google verification meta tag

on:
  push:
    paths:
      - '.github/workflows/add-google-verification.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert verification tag
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '    <meta name="google-site-verification" content="yLTWQVmd2G1uRT9k73tLHQSxzCsZVaeSyvI9RlWpQjo">'

          if 'google-site-verification' not in text:
              anchor = '    <meta name="robots" content="index, follow">'
              if anchor not in text:
                  raise SystemExit('Expected robots meta tag not found')
              text = text.replace(anchor, anchor + '\n' + tag, 1)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/add-google-verification.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit verification tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-google-verification.yml
          git commit -m "Add Google Search Console verification tag" || exit 0
          git push
