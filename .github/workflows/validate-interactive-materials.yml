name: Validate interactive materials

on:
  pull_request:
    paths:
      - "interactive-notes/functions/**"
      - "interactive-notes/fractions/**"
      - "interactive-notes/quadratics/**"
      - "interactive-notes/inequalities/**"
      - "interactive-notes/limits/**"
      - "interactive-notes/linear-equations/**"
      - "scripts/test-inequalities.mjs"
      - "scripts/test-quadratics.mjs"
      - "scripts/test-limits.mjs"
      - "scripts/test-fractions.mjs"
      - "scripts/validate_interactive_materials.py"
      - ".github/workflows/validate-interactive-materials.yml"
  push:
    branches:
      - main
    paths:
      - "interactive-notes/functions/**"
      - "interactive-notes/fractions/**"
      - "interactive-notes/quadratics/**"
      - "interactive-notes/inequalities/**"
      - "interactive-notes/limits/**"
      - "interactive-notes/linear-equations/**"
      - "scripts/test-inequalities.mjs"
      - "scripts/test-quadratics.mjs"
      - "scripts/test-limits.mjs"
      - "scripts/test-fractions.mjs"
      - "scripts/validate_interactive_materials.py"
      - ".github/workflows/validate-interactive-materials.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML structure and local links
        run: python scripts/validate_interactive_materials.py

      - name: Check JavaScript syntax
        run: node --check interactive-notes/functions/app.js

      - name: Check premium fractions lesson
        run: |
          node --check interactive-notes/fractions/app.js
          node scripts/test-fractions.mjs

      - name: Check interactive quadratic lesson
        run: |
          node --check interactive-notes/quadratics/app.js
          node scripts/test-quadratics.mjs

      - name: Check premium limits lesson
        run: |
          node --check interactive-notes/limits/app.js
          node scripts/test-limits.mjs

      - name: Check linear equations interactive module
        run: node --check interactive-notes/linear-equations/app.js

      - name: Check interactive inequalities lesson
        run: |
          node --check interactive-notes/inequalities/app.mjs
          node --check interactive-notes/inequalities/math.mjs
          node scripts/test-inequalities.mjs
