name: Apply student dashboard update

on:
  push:
    paths:
      - ".student-updates/*.json"

permissions:
  contents: write

concurrency:
  group: student-dashboard-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Install Cloudflare portal dependencies
        working-directory: cloudflare-portal
        run: npm install --no-audit --no-fund

      - name: Apply queued updates directly to production D1
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          updates=(.student-updates/*.json)
          if [ ${#updates[@]} -eq 0 ]; then
            echo "No dashboard updates found."
            exit 0
          fi
          for update in "${updates[@]}"; do
            node cloudflare-portal/scripts/apply-profile-patch.mjs "$update"
            rm -f "$update"
          done

      - name: Commit consumed queue entries
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No queue cleanup to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .student-updates
          git commit -m "Consume student D1 updates"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
