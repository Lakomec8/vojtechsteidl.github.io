name: Deploy secure student portal

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-portal/**"
      - "assets/student-portal.js"
      - "assets/student-portal.css"
      - "assets/student-dashboard-featured.js"
      - "assets/student-next-lesson.js"
      - "assets/student-payment.js"
      - "assets/student-self-checks.js"
      - ".github/workflows/deploy-cloudflare-portal.yml"
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-student-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Install dependencies
        working-directory: cloudflare-portal
        run: npm install --no-audit --no-fund

      - name: Build secure portal
        working-directory: cloudflare-portal
        run: npm run build

      - name: Typecheck Worker and bindings
        working-directory: cloudflare-portal
        run: npm run typecheck

      - name: Verify next-week calendar calculation
        working-directory: cloudflare-portal
        run: npm run test:public-capacity

      - name: Verify branded sender and prevent accidental personal Gmail exposure
        working-directory: cloudflare-portal
        run: npm run test:branded-booking-mail

      - name: Exercise customer booking alerts and safe cancellation
        working-directory: cloudflare-portal
        run: npm run test:public-bookings

      - name: Verify calendar synchronization writes
        working-directory: cloudflare-portal
        run: npm run test:calendar-ingestion

      - name: Test shared calendar lessons for both students
        working-directory: cloudflare-portal
        run: node scripts/test-student-calendar-upcoming.mjs

      - name: Test admin self-check answer history and authorization
        working-directory: cloudflare-portal
        run: npm run test:self-check-results

      - name: Verify partial self-check grading and student-safe persistence
        working-directory: cloudflare-portal
        run: npm run test:self-check-partial

      - name: Verify student self-check history and dashboard wiring
        working-directory: cloudflare-portal
        run: npm run test:self-check-history

      - name: Exercise saved-test button in simulated student dashboard
        working-directory: cloudflare-portal
        run: npm run test:self-check-dashboard-ui

      - name: Verify Karolína's quadratic diagnostic and assignment in SQLite
        working-directory: cloudflare-portal
        run: python3 scripts/test-karolina-quadratics-content.py

      - name: Validate three-column student resources and dashboard test actions
        working-directory: cloudflare-portal
        run: node scripts/test-student-resource-columns.mjs

      - name: Apply production database migrations
        working-directory: cloudflare-portal
        run: npm run db:migrate:remote

      - name: Audit active portal accounts and Access policy
        working-directory: cloudflare-portal
        env:
          PORTAL_POLICY_AUD: 89190bdbddce22e6d1bc3c2d2e42ae790ec5aedfb00adbe8eb0ce6d0c71225d2
        run: npm run audit:access

      - name: Audit calendar-backed student dashboard data
        working-directory: cloudflare-portal
        run: node scripts/audit-student-portal.mjs

      - name: Deploy production Worker
        working-directory: cloudflare-portal
        run: npx wrangler deploy

      - name: Deploy isolated public calendar capacity Worker
        working-directory: cloudflare-portal
        run: npx wrangler deploy --config wrangler.public-capacity.jsonc

      - name: Verify Dan's two completed Calendar lessons
        working-directory: cloudflare-portal
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            npx wrangler d1 execute DB --remote --json --command "
              SELECT COUNT(*) AS lesson_count,
                     SUM(duration_minutes) AS lesson_minutes
                FROM tutoring_lessons
               WHERE student_id = (
                     SELECT link.tutoring_student_id
                       FROM student_tutoring_links AS link
                       JOIN students AS student ON student.id = link.student_id
                      WHERE student.display_name = 'Dan Štec' COLLATE NOCASE
                        AND student.enabled = 1
               )
                 AND source = 'google_calendar'
                 AND payment_status <> 'cancelled'
                 AND lesson_date IN ('2026-10-06', '2026-10-13');
            " > /tmp/dan-lessons.json
            if jq -e '.[0].results[0] | .lesson_count == 2 and .lesson_minutes == 120' /tmp/dan-lessons.json >/dev/null; then
              echo "Dan's two completed Calendar lessons are recorded."
              exit 0
            fi
            sleep 10
          done
          cat /tmp/dan-lessons.json
          echo "Dan's completed Calendar lessons were not reconciled in time." >&2
          exit 1

      - name: Smoke test publicly available calendar
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 'https://capacity.vojtechsteidl.eu/api/public-capacity' -o /tmp/public-capacity.json \
               && jq -e '.calendarSyncedAt != null and (.slots | type == "array") and (.availability.diagnostic_30 | type == "array") and (.availability.lesson_60 | type == "array") and .timeZone == "Europe/Prague" and .week.startDate' /tmp/public-capacity.json > /dev/null; then
              # Regression check against known Google Calendar commitments on 19–23 Oct 2026.
              # Ignore outside that specific next-week window.
              if jq -e '.week.startDate == "2026-10-19"' /tmp/public-capacity.json >/dev/null; then
                jq -e '[.slots[] | select(.kind == "free" and (
                  (.weekday == 1 and .time == "17:45–18:45") or
                  (.weekday == 2 and .time == "16:30–17:30") or
                  (.weekday == 5 and .time == "15:15–16:15")
                ))] | length == 0' /tmp/public-capacity.json >/dev/null || {
                  echo "Public calendar exposes a Google Calendar busy interval as free." >&2
                  exit 1
                }
              fi
              if jq -e '.week.startDate == "2026-10-19"' /tmp/public-capacity.json >/dev/null; then
                jq -e '(
                  any(.slots[]; .weekday == 1 and .time == "18:00–19:00" and .title == "Matematika" and .kind == "join")
                ) and (
                  any(.slots[]; .weekday == 5 and .time == "15:30–16:30" and .title == "Fyzika" and .kind == "join")
                ) and (
                  all(.slots[]; (.title | test("Kája|Eliška|Doučko"; "i") | not))
                )' /tmp/public-capacity.json >/dev/null || {
                  echo "Live Google Calendar tutoring lessons are missing or private details leaked." >&2
                  exit 1
                }
              fi
              echo "Public calendar API is reachable, synchronized, and shows the expected anonymized lessons."
              exit 0
            fi
            sleep 3
          done
          echo "Public calendar endpoint is not accessible with synchronized availability." >&2
          exit 1
