name: Migrate student materials to R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: vojtechsteidl-student-materials

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Install Cloudflare portal dependencies
        working-directory: cloudflare-portal
        run: npm install --no-audit --no-fund

      - name: Ensure private R2 bucket exists
        working-directory: cloudflare-portal
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket list | grep -Fq "$R2_BUCKET"; then
            echo "R2 bucket already exists: $R2_BUCKET"
          else
            npx wrangler r2 bucket create "$R2_BUCKET"
          fi

      - name: Upload existing student materials
        run: node cloudflare-portal/scripts/migrate-materials-to-r2.mjs

      - name: Confirm R2 bucket
        working-directory: cloudflare-portal
        shell: bash
        run: npx wrangler r2 bucket list | grep -F "$R2_BUCKET"
