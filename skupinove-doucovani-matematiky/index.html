<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Týdenní kalendář doučování | Vojtěch Steidl</title>
  <meta name="description" content="Aktuální týdenní kapacita doučování. Vyberte volný slot nebo se přidejte k existujícímu studentovi se stejným cílem.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://vojtechsteidl.eu/skupinove-doucovani-matematiky/">
  <link rel="stylesheet" href="../style.css?v=20261005-calendar">
  <style>
    .calendar-page{width:min(1180px,calc(100% - 2rem));margin:0 auto;padding:6.5rem 0 5rem}
    .calendar-page-head{display:flex;justify-content:space-between;gap:1rem;align-items:end;margin-bottom:1rem}
    .calendar-page-head h1{margin:.2rem 0 0;color:#102a43;font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.05em}
    .calendar-page-head p:last-child{color:#64748b;font-size:.9rem}
    @media(max-width:760px){.calendar-page{padding-top:5.2rem}.calendar-page-head{display:block}}
  </style>
</head>
<body>
  <header class="site-header"><nav class="nav" aria-label="Hlavní navigace"><a href="../" class="logo">Vojtěch Steidl</a><a href="../#kontakt" class="nav-contact">Kontakt</a></nav></header>
  <main class="calendar-page">
    <div class="calendar-page-head">
      <div><p class="eyebrow">Stávající kapacita</p><h1>Týdenní kalendář</h1></div>
      <p>Vyberte volný slot nebo se přidejte k existujícímu termínu.</p>
    </div>
    <div class="capacity-legend"><span><i class="legend-dot join"></i> lze se přidat</span><span><i class="legend-dot free"></i> volný slot</span></div>
    <div class="weekly-calendar-wrap" style="margin-top:1rem"><div class="weekly-calendar" id="weeklyCalendar"><p class="capacity-loading">Načítám kalendář…</p></div></div>
    <div class="slot-selection" id="slotSelection" hidden>
      <div class="slot-selection-copy"><span class="slot-selection-label">Vybraný slot</span><strong id="selectedSlotTitle"></strong><span id="selectedSlotMeta"></span></div>
      <form class="slot-selection-form" id="slotBookingForm">
        <input type="hidden" id="selectedSlotId" name="slot_id"><input type="hidden" id="selectedSlotInfo" name="slot_info">
        <input type="text" name="name" placeholder="Jméno" autocomplete="name" required>
        <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
        <button type="submit">Potvrdit výběr</button>
        <p class="form-status" id="slotBookingStatus" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <footer>© 2026 Vojtěch Steidl · Online doučování matematiky a fyziky</footer>
  <script>
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const calendarEl=document.getElementById('weeklyCalendar'),selection=document.getElementById('slotSelection');
    const selectedTitle=document.getElementById('selectedSlotTitle'),selectedMeta=document.getElementById('selectedSlotMeta'),selectedId=document.getElementById('selectedSlotId'),selectedInfo=document.getElementById('selectedSlotInfo');
    const form=document.getElementById('slotBookingForm'),status=document.getElementById('slotBookingStatus');
    fetch('/data/group-capacity.json?v=20261005-calendar')
      .then(r=>{if(!r.ok)throw new Error('fetch');return r.json();})
      .then(data=>{
        const slots=data.slots||[];
        calendarEl.innerHTML=(data.days||[]).map(day=>`<section class="calendar-day"><h3>${escapeHtml(day)}</h3><div class="calendar-day-slots">${slots.filter(s=>s.day===day).map(slot=>{
          const full=slot.people>=slot.capacity,free=slot.people===0,state=full?'full':(free?'free':'join'),action=full?'Plno':(free?'Vybrat slot':'Přidat se');
          return `<article class="calendar-slot ${state}"><div class="calendar-slot-time">${escapeHtml(slot.time)}</div><strong>${escapeHtml(slot.title)}</strong><div class="calendar-slot-foot"><span>${slot.people}/${slot.capacity}</span>${full?'<span class="calendar-slot-action disabled">Plno</span>':`<button type="button" class="calendar-slot-action" data-slot-id="${escapeHtml(slot.id)}">${action}</button>`}</div></article>`;
        }).join('')}</div></section>`).join('');
        calendarEl.querySelectorAll('[data-slot-id]').forEach(button=>button.addEventListener('click',()=>{
          const slot=slots.find(s=>s.id===button.dataset.slotId);if(!slot)return;
          selectedTitle.textContent=slot.title;selectedMeta.textContent=`${slot.day} · ${slot.time} · ${slot.people}/${slot.capacity} míst`;selectedId.value=slot.id;selectedInfo.value=`${slot.day} ${slot.time} | ${slot.title} | ${slot.people}/${slot.capacity}`;selection.hidden=false;selection.scrollIntoView({behavior:'smooth',block:'nearest'});
        }));
      }).catch(()=>{calendarEl.innerHTML='<p class="capacity-loading">Kalendář se nepodařilo načíst.</p>';});
    form.addEventListener('submit',async event=>{
      event.preventDefault();const button=form.querySelector('button'),original=button.textContent,data=new FormData(form);
      data.append('access_key','36faa5ca-b116-4bbb-9543-81ecd1f78b55');data.append('subject','Výběr slotu z kalendáře vojtechsteidl.eu');
      button.disabled=true;button.textContent='Potvrzuji…';status.textContent='';status.className='form-status';
      try{const response=await fetch('https://api.web3forms.com/submit',{method:'POST',body:data});const result=await response.json();if(!result.success)throw new Error('submit');status.textContent='Výběr mám. Ozvu se s potvrzením konkrétního slotu.';status.classList.add('success');}
      catch(error){status.textContent='Potvrzení se nepodařilo odeslat. Napište prosím na vojtasteidl@seznam.cz.';status.classList.add('error');}
      finally{button.disabled=false;button.textContent=original;}
    });
  </script>
</body>
</html>
